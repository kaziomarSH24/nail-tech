image: docker:24.0.5

services:
  - docker:24.0.5-dind

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

stages:
  - build-push

build_and_push:
  stage: build-push
  only:
    - main

  before_script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

  script:
    - docker pull $DOCKERHUB_USERNAME/nails-backend:latest || true

    - docker build --cache-from $DOCKERHUB_USERNAME/nails-backend:latest -t $DOCKERHUB_USERNAME/nails-backend:latest -t $DOCKERHUB_USERNAME/nails-backend:$CI_COMMIT_SHA .
    
    - docker push $DOCKERHUB_USERNAME/nails-backend:latest
    - docker push $DOCKERHUB_USERNAME/nails-backend:$CI_COMMIT_SHA
