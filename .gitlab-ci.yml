image:
  name: gcr.io/kaniko-project/executor:v1.14.0-debug
  entrypoint: [""]

stages:
  - build-push
  - deploy

build_and_push:
  stage: build-push
  tags:
    - linux
  only:
    - main
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"auth\":\"$(printf "%s:%s" "${DOCKERHUB_USERNAME}" "${DOCKERHUB_TOKEN}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json

    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${DOCKERHUB_USERNAME}/nails-backend:latest"
      --destination "${DOCKERHUB_USERNAME}/nails-backend:${CI_COMMIT_SHA}"
      --cache=false
      --compressed-caching=false

deploy_to_server:
  stage: deploy
  image: alpine:latest
  tags:
    - linux
  only:
    - main
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - ssh $SERVER_USER@$SERVER_IP "cd $SERVER_DEPLOY_PATH && docker compose pull"
    - ssh $SERVER_USER@$SERVER_IP "cd $SERVER_DEPLOY_PATH && docker compose up -d"
    - ssh $SERVER_USER@$SERVER_IP "cd $SERVER_DEPLOY_PATH && docker compose exec -T nails-app php artisan optimize:clear"
    - ssh $SERVER_USER@$SERVER_IP "cd $SERVER_DEPLOY_PATH && docker compose exec -T nails-app php artisan migrate --force"
    - ssh $SERVER_USER@$SERVER_IP "docker image prune -f"
